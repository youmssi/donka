name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege; a newer push to the same branch or PR cancels the older run.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donka
          POSTGRES_PASSWORD: donka
          POSTGRES_DB: donka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U donka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # sqlx::test creates a throwaway database per test from this server.
      DATABASE_URL: postgres://donka:donka@localhost:5432/donka
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Compare against the runtime's next release so Studio and Runtime evaluate identically.
      - uses: actions/checkout@v4
        with:
          repository: youmssi/donka-runtime
          ref: develop
          path: donka-runtime
      - run: scripts/check-engine-version.sh donka-runtime

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The pnpm version comes from packageManager in the web app's package.json.
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
      # The typed client must match apps/web/openapi.json (kept in step by the Rust tests).
      - run: pnpm api:generate && git diff --exit-code -- src/components/shared/api/schema.d.ts
      - run: pnpm build
