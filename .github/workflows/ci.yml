name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege; a newer push to the same branch or PR cancels the older run.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donka
          POSTGRES_PASSWORD: donka
          POSTGRES_DB: donka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U donka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # sqlx::test creates a throwaway database per test from this server.
      DATABASE_URL: postgres://donka:donka@localhost:5432/donka
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Compare against the runtime's next release so Studio and Runtime evaluate identically.
      - uses: actions/checkout@v4
        with:
          repository: youmssi/donka-runtime
          ref: develop
          path: donka-runtime
      - run: scripts/check-engine-version.sh donka-runtime

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The pnpm version comes from packageManager in the web app's package.json.
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
      # The typed client must match apps/web/openapi.json (kept in step by the Rust tests).
      - run: pnpm api:generate && git diff --exit-code -- src/components/shared/api/schema.d.ts
      - run: pnpm build

  # The Studio image, built as it ships but not pushed: dependencies in their own cached layer,
  # a non-root user, and the version it was built with.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donka
          POSTGRES_PASSWORD: donka
          POSTGRES_DB: donka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U donka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          build-args: SERVICE_VERSION=${{ github.sha }}
          tags: donka-studio:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/check-image.sh donka-studio:ci ${{ github.sha }}

  # The one-command install: `docker compose --profile full up` with its defaults, then the
  # post-deploy smoke test against it. Images come from the same compose file (bake), cached.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: app,runtime
          load: true
          set: |
            app.cache-from=type=gha
            runtime.cache-from=type=gha,scope=runtime
            runtime.cache-to=type=gha,mode=max,scope=runtime
      - run: docker compose --profile full up -d
      - name: First administrator
        run: |
          for _ in $(seq 1 90); do
            curl -sf localhost:8080/api/v1/health >/dev/null && break
            sleep 1
          done
          token=$(docker compose logs app | grep -o 'setup-password/?token=[A-Za-z0-9_-]*' | head -1 | cut -d= -f2)
          [ -n "$token" ] || { echo "no password-setup link in the logs"; exit 1; }
          curl -sS --fail-with-body -X POST localhost:8080/api/v1/auth/password-setup \
            -H 'content-type: application/json' -H 'x-donka-csrf: 1' \
            --data "{\"token\": \"$token\", \"password\": \"smoke test passphrase\"}"
      - run: scripts/smoke.sh
        env:
          STUDIO_URL: http://localhost:8080
          RUNTIME_URL: http://localhost:8090
          DONKA_SMOKE_EMAIL: admin@donka.local
          DONKA_SMOKE_PASSWORD: smoke test passphrase
      # Idempotent: a second run reuses the smoke project.
      - run: scripts/smoke.sh
        env:
          STUDIO_URL: http://localhost:8080
          RUNTIME_URL: http://localhost:8090
          DONKA_SMOKE_EMAIL: admin@donka.local
          DONKA_SMOKE_PASSWORD: smoke test passphrase
      - name: Logs
        if: failure()
        run: docker compose --profile full logs --tail 100

  # A release made in Studio reaches Donka Runtime through MinIO and answers with its token;
  # its bureau connector calls a fake bureau from the Runtime only.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: donka
          POSTGRES_PASSWORD: donka
          POSTGRES_DB: donka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U donka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: youmssi/donka-runtime
          ref: develop
          path: donka-runtime
      # Next to Studio, as in development: inside it, Cargo would take it for a workspace member.
      - run: mv donka-runtime ../donka-runtime
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../donka-runtime
      - run: cargo build --locked -p donka-app
      - run: cargo build --locked
        working-directory: ../donka-runtime
      # A service container cannot take the server command, so MinIO starts here.
      - name: MinIO with the release bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=donka -e MINIO_ROOT_PASSWORD=donka-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          docker run --rm --network host --entrypoint sh pgsty/mc:RELEASE.2026-09-16T00-00-00Z -c \
            "until mc alias set local http://127.0.0.1:9000 donka donka-secret; do sleep 1; done;
             mc mb local/donka-releases"
      - name: Studio and a fake bureau
        run: |
          FAKE_BUREAU_KEY=e2e-bureau-secret nohup scripts/fake-bureau.py 127.0.0.1 8099 > bureau.log 2>&1 &
          DATABASE_URL=postgres://donka:donka@localhost:5432/donka DONKA_LISTEN=127.0.0.1:8181 \
          DONKA_PUBLIC_URL=http://localhost:8181 DONKA_COOKIE_SECURE=false \
          DONKA_BOOTSTRAP_ADMIN_EMAIL=ada@bank.example \
          DONKA_SMTP_URL=smtp://127.0.0.1:1025 DONKA_SMTP_FROM="Donka <donka@localhost>" \
          DONKA_STORAGE_URL=s3://donka-releases DONKA_STORAGE_ENDPOINT=http://127.0.0.1:9000 \
          DONKA_STORAGE_REGION=us-east-1 DONKA_STORAGE_ACCESS_KEY_ID=donka \
          DONKA_STORAGE_SECRET_ACCESS_KEY=donka-secret \
          DONKA_DECISION_LOG_KEY=$(openssl rand -base64 32) \
            nohup target/debug/donka-app > studio.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf localhost:8181/api/v1/health >/dev/null && exit 0
            sleep 1
          done
          exit 1
      # The script starts the Runtime (a debug build listens on 127.0.0.1:3000) once Studio has
      # issued it a decision-log token; the Runtime takes the rest of its settings from here.
      - run: scripts/e2e.sh
        env:
          STUDIO_URL: http://localhost:8181
          RUNTIME_URL: http://localhost:3000
          RUNTIME_BIN: ../donka-runtime/target/debug/donka-runtime
          RUNTIME_LOG: runtime.log
          STUDIO_LOG: studio.log
          BUREAU_URL: http://127.0.0.1:8099
          BUREAU_SECRET: e2e-bureau-secret
          PROVIDER__TYPE: S3
          PROVIDER__BUCKET: donka-releases
          PROVIDER__REGION: us-east-1
          PROVIDER__ENDPOINT: http://127.0.0.1:9000
          PROVIDER__FORCE_PATH_STYLE: "true"
          PROVIDER__PREFIX: staging/
          AWS_ACCESS_KEY_ID: donka
          AWS_SECRET_ACCESS_KEY: donka-secret
          DONKA_SECRET_BUREAU_API_KEY: e2e-bureau-secret
      - name: Logs
        if: failure()
        run: tail -n 100 studio.log runtime.log bureau.log
