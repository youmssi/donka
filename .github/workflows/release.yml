name: Release

# One Studio version (app + web, one image) from Conventional Commits (DNK-30).
#
# 1. A promotion PR merges develop into main (merge commit).
# 2. On every push to main, release-please keeps one release PR open with the next
#    version (Cargo.toml, apps/web/package.json, version.txt) and the CHANGELOG entry.
#    Cargo.lock is refreshed on that PR so `--locked` builds keep passing.
# 3. Merging the release PR tags vX.Y.Z and creates the GitHub release; this workflow
#    then opens a back-merge PR main -> develop (merge commit) so the bump reaches develop.
#
# Nothing is published to a package registry. With GITHUB_TOKEN, CI does not run on the
# PRs this workflow opens; set a RELEASE_PLEASE_TOKEN secret (fine-grained PAT: contents +
# pull requests, write) to have CI run on them.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.pr

      - name: Refresh Cargo.lock on the release PR
        if: steps.release.outputs.pr
        run: |
          cargo update --workspace
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build: refresh Cargo.lock for the release"
          git push

      - name: Open the back-merge PR into develop
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: bring release $TAG back into develop" \
            --body "Merge with a **merge commit** (not squash) so develop and main share the release commit."
