name: Images

# Studio's published image (DNK-64): ghcr.io/youmssi/donka-studio.
#
# - Every push to develop publishes `edge` and `sha-<commit>`, for staging and demos.
# - Each release (called by release.yml with its tag) publishes `X.Y.Z`, `X.Y` and `latest`.
#   Its offline bundle, signed with the same key, is attached to the GitHub release.
# - After each publish, a fresh runner measures the install: pull, init --demo, start, until a
#   Runtime decision is recorded in Studio, within five minutes.
#
# Every image carries an SBOM and a provenance attestation, and is signed with cosign using
# the key pair whose public key is `cosign.pub` at the root of this repository. Signatures are
# not uploaded to the public transparency log, so a bank verifies them without network access:
#
#   cosign verify --key cosign.pub --insecure-ignore-tlog ghcr.io/youmssi/donka-studio:X.Y.Z
#
# Signing needs the COSIGN_PRIVATE_KEY and COSIGN_PASSWORD secrets. A release refuses to
# publish without them; an `edge` image is published unsigned, with a warning.

on:
  push:
    branches: [develop]
  workflow_call:
    inputs:
      version:
        description: The release version, without the leading v (e.g. 1.5.0).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Publish this version again from its tag (e.g. 1.5.0).
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/youmssi/donka-studio

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}

      - name: Signing key
        id: key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          RELEASE: ${{ inputs.version != '' }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not set: a release is never published unsigned."
            exit 1
          else
            echo "::warning::COSIGN_PRIVATE_KEY is not set: this edge image is published unsigned."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=sha,prefix=sha-,format=long,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Donka Studio
            org.opencontainers.image.vendor=Donka

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/app/Dockerfile
          build-args: SERVICE_VERSION=${{ inputs.version || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
        if: steps.key.outputs.present == 'true'
        with:
          cosign-release: v2.5.2

      - name: Sign
        if: steps.key.outputs.present == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --recursive "$IMAGE@$DIGEST"

      - name: Verify with the published public key
        if: steps.key.outputs.present == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -f cosign.pub || { echo "::error::cosign.pub is missing from the repository"; exit 1; }
          cosign verify --key cosign.pub --insecure-ignore-tlog "$IMAGE@$DIGEST" > /dev/null

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SIGNED: ${{ steps.key.outputs.present }}
        run: |
          {
            echo "### $IMAGE@$DIGEST"
            echo
            echo "Signed: $SIGNED"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The five-minute promise, measured on a fresh runner (the reference machine: GitHub's
  # ubuntu-latest, 4 vCPU and 16 GB): pull the published images, prepare the demo installation
  # and start it, until a Runtime decision is recorded in Studio.
  measure:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      STUDIO_TAG: ${{ inputs.version || format('sha-{0}', github.sha) }}
      RUNTIME_TAG: ${{ inputs.version && 'latest' || 'edge' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the images
        run: |
          echo "DONKA_INSTALL_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          scripts/install-images.sh "$STUDIO_TAG" "$RUNTIME_TAG" | xargs -n1 docker pull -q
      - run: scripts/check-install.sh "$STUDIO_TAG" "$RUNTIME_TAG" demo | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          DONKA_INSTALL_BUDGET: 300

  # A release's offline bundle, attached to its GitHub release: its signed images and the
  # latest Runtime release's, checked against each repository's cosign.pub, then signed as one.
  bundle:
    needs: publish
    if: inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.2
      - name: Check the images' signatures
        run: |
          runtime=$(gh release view --repo youmssi/donka-runtime --json tagName -q .tagName)
          echo "RUNTIME_VERSION=${runtime#v}" >> "$GITHUB_ENV"
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/youmssi/donka-runtime/contents/cosign.pub?ref=$runtime" > "$RUNNER_TEMP/runtime-cosign.pub"
          cosign verify --key cosign.pub --insecure-ignore-tlog "$IMAGE:$VERSION" > /dev/null
          cosign verify --key "$RUNNER_TEMP/runtime-cosign.pub" --insecure-ignore-tlog \
            "ghcr.io/youmssi/donka-runtime:${runtime#v}" > /dev/null
      - name: Bundle and sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          bundle=$(scripts/bundle.sh "$VERSION" "$RUNTIME_VERSION" "$RUNNER_TEMP")
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature "$bundle/SHA256SUMS.sig" "$bundle/SHA256SUMS"
          cosign verify-blob --key cosign.pub --insecure-ignore-tlog \
            --signature "$bundle/SHA256SUMS.sig" "$bundle/SHA256SUMS"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/donka-$VERSION-offline.tar" "donka-$VERSION-offline"
          gh release upload "v$VERSION" "$RUNNER_TEMP/donka-$VERSION-offline.tar" --clobber
