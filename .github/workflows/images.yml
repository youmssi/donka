name: Images

# Studio's published image (DNK-64): ghcr.io/youmssi/donka-studio.
#
# - Every push to develop publishes `edge` and `sha-<commit>`, for staging and demos.
# - Each release (called by release.yml with its tag) publishes `X.Y.Z`, `X.Y` and `latest`.
#   Its offline bundle, signed with the same key, is attached to the GitHub release.
# - After each publish, a fresh runner measures the install: pull, init --demo, start, until a
#   Runtime decision is recorded in Studio, within five minutes.
#
# Every image carries an SBOM and a provenance attestation, and is signed with cosign using
# the key pair whose public key is `cosign.pub` at the root of this repository. Signatures are
# not uploaded to the public transparency log, so a bank verifies them without network access:
#
#   cosign verify --key cosign.pub --insecure-ignore-tlog ghcr.io/youmssi/donka-studio:X.Y.Z
#
# Signing needs the COSIGN_PRIVATE_KEY and COSIGN_PASSWORD secrets. A release refuses to
# publish without them; an `edge` image is published unsigned, with a warning.

on:
  push:
    branches: [develop]
  workflow_call:
    inputs:
      version:
        description: The release version, without the leading v (e.g. 1.5.0).
        required: true
        type: string
      candidate:
        description: Publish only the exact prerelease image tag, without stable aliases.
        required: false
        default: false
        type: boolean
      runtime_version:
        description: Runtime candidate version required for an isolated candidate install check.
        required: false
        default: ""
        type: string
      runtime_digest:
        description: Verified Runtime candidate digest used by the isolated install check.
        required: false
        default: ""
        type: string
    outputs:
      digest:
        description: Digest of the scanned OCI image published by this workflow.
        value: ${{ jobs.publish.outputs.digest }}
  workflow_dispatch:
    inputs:
      version:
        description: Publish this version again from its tag (e.g. 1.5.0).
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ inputs.candidate && 'candidate-' || '' }}${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/youmssi/donka-studio

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A candidate has no tag yet: its release stays a draft until the publish job, and a
          # draft creates no Git tag. Build the candidate from the dispatched commit instead.
          ref: ${{ (inputs.version != '' && inputs.candidate != true) && format('v{0}', inputs.version) || github.sha }}

      - name: Signing key
        id: key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          RELEASE: ${{ inputs.version != '' }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not set: a release is never published unsigned."
            exit 1
          else
            echo "::warning::COSIGN_PRIVATE_KEY is not set: this edge image is published unsigned."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep prereleases on the candidate workflow
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [[ "$VERSION" == *-* && "$CANDIDATE" != "true" ]]; then
            echo "::error::Prerelease versions must use the signed candidate workflow."
            exit 1
          fi

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=sha,prefix=sha-,format=long,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.candidate == true }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' && inputs.candidate != true }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' && inputs.candidate != true }}
            type=raw,value=latest,enable=${{ inputs.version != '' && inputs.candidate != true }}
          labels: |
            org.opencontainers.image.title=Donka Studio
            org.opencontainers.image.vendor=Donka

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reject an existing candidate image tag
        if: inputs.candidate == true
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ inputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>"$RUNNER_TEMP/candidate-manifest-error"; then
            echo "::error::Candidate image tag already exists; choose a new -rc.N version."
            exit 1
          elif grep -Eqi 'manifest unknown|no such manifest' "$RUNNER_TEMP/candidate-manifest-error"; then
            echo "Candidate image tag is not present."
          else
            cat "$RUNNER_TEMP/candidate-manifest-error"
            echo "::error::Could not confirm that the candidate image tag is unused."
            exit 1
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: apps/app/Dockerfile
          build-args: SERVICE_VERSION=${{ inputs.version || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/studio-image,tar=false
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          input: ${{ runner.temp }}/studio-image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish the scanned index with its attestations
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          authfile="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          while IFS= read -r tag; do
            source_tag="${tag##*:}"
            skopeo copy --all --preserve-digests --authfile "$authfile" \
              "oci:$RUNNER_TEMP/studio-image:$source_tag" "docker://$tag"
          done <<< "$TAGS"
          found=$(skopeo inspect --raw --authfile "$authfile" "docker://$IMAGE@$DIGEST" | sha256sum | cut -d' ' -f1)
          test "sha256:$found" = "$DIGEST"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.key.outputs.present == 'true'
        with:
          cosign-release: v2.5.2

      - name: Sign
        if: steps.key.outputs.present == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --recursive "$IMAGE@$DIGEST"

      - name: Verify with the published public key
        if: steps.key.outputs.present == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -f cosign.pub || { echo "::error::cosign.pub is missing from the repository"; exit 1; }
          cosign verify --key cosign.pub --insecure-ignore-tlog "$IMAGE@$DIGEST" > /dev/null

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SIGNED: ${{ steps.key.outputs.present }}
        run: |
          {
            echo "### $IMAGE@$DIGEST"
            echo
            echo "Signed: $SIGNED"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The five-minute promise, measured on a fresh runner (the reference machine: GitHub's
  # ubuntu-latest, 4 vCPU and 16 GB): pull the published images, prepare the demo installation
  # and start it, until a Runtime decision is recorded in Studio.
  measure:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      STUDIO_TAG: ${{ inputs.version || format('sha-{0}', github.sha) }}
      RUNTIME_TAG: ${{ inputs.candidate && inputs.runtime_version || (inputs.version && 'latest') || 'edge' }}
      STUDIO_DIGEST: ${{ needs.publish.outputs.digest }}
      RUNTIME_DIGEST: ${{ inputs.runtime_digest }}
      STUDIO_IMAGE: ghcr.io/youmssi/donka-studio
      RUNTIME_IMAGE: ghcr.io/youmssi/donka-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A candidate has no tag yet: its release stays a draft until the publish job, and a
          # draft creates no Git tag. Build the candidate from the dispatched commit instead.
          ref: ${{ (inputs.version != '' && inputs.candidate != true) && format('v{0}', inputs.version) || github.sha }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the images
        run: |
          echo "DONKA_INSTALL_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ inputs.candidate }}" = "true" ]; then
            test -n "$STUDIO_DIGEST" && test -n "$RUNTIME_DIGEST"
            docker pull "$STUDIO_IMAGE@$STUDIO_DIGEST"
            docker tag "$STUDIO_IMAGE@$STUDIO_DIGEST" "$STUDIO_IMAGE:$STUDIO_TAG"
            docker pull "$RUNTIME_IMAGE@$RUNTIME_DIGEST"
            docker tag "$RUNTIME_IMAGE@$RUNTIME_DIGEST" "$RUNTIME_IMAGE:$RUNTIME_TAG"
            docker image inspect "$STUDIO_IMAGE:$STUDIO_TAG" --format '{{json .RepoDigests}}' \
              | jq -e --arg ref "$STUDIO_IMAGE@$STUDIO_DIGEST" 'index($ref) != null'
            docker image inspect "$RUNTIME_IMAGE:$RUNTIME_TAG" --format '{{json .RepoDigests}}' \
              | jq -e --arg ref "$RUNTIME_IMAGE@$RUNTIME_DIGEST" 'index($ref) != null'
            while IFS= read -r image; do
              case "$image" in
                "$STUDIO_IMAGE:$STUDIO_TAG"|"$RUNTIME_IMAGE:$RUNTIME_TAG") ;;
                *) docker pull -q "$image" ;;
              esac
            done < <(scripts/install-images.sh "$STUDIO_TAG" "$RUNTIME_TAG")
          else
            scripts/install-images.sh "$STUDIO_TAG" "$RUNTIME_TAG" | xargs -n1 docker pull -q
          fi
      - run: scripts/check-install.sh "$STUDIO_TAG" "$RUNTIME_TAG" demo | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          DONKA_INSTALL_BUDGET: 300

  # A release's offline bundle, attached to its GitHub release: its signed images and the
  # latest Runtime release's, checked against each repository's cosign.pub, then signed as one.
  bundle:
    needs: publish
    if: inputs.version != '' && inputs.candidate != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.2
      - name: Check the images' signatures
        run: |
          runtime=$(gh release view --repo youmssi/donka-runtime --json tagName -q .tagName)
          echo "RUNTIME_VERSION=${runtime#v}" >> "$GITHUB_ENV"
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/youmssi/donka-runtime/contents/cosign.pub?ref=$runtime" > "$RUNNER_TEMP/runtime-cosign.pub"
          cosign verify --key cosign.pub --insecure-ignore-tlog "$IMAGE:$VERSION" > /dev/null
          cosign verify --key "$RUNNER_TEMP/runtime-cosign.pub" --insecure-ignore-tlog \
            "ghcr.io/youmssi/donka-runtime:${runtime#v}" > /dev/null
      - name: Bundle and sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          bundle=$(scripts/bundle.sh "$VERSION" "$RUNTIME_VERSION" "$RUNNER_TEMP")
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature "$bundle/SHA256SUMS.sig" "$bundle/SHA256SUMS"
          cosign verify-blob --key cosign.pub --insecure-ignore-tlog \
            --signature "$bundle/SHA256SUMS.sig" "$bundle/SHA256SUMS"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/donka-$VERSION-offline.tar" "donka-$VERSION-offline"
          gh release upload "v$VERSION" "$RUNNER_TEMP/donka-$VERSION-offline.tar" --clobber
