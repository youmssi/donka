[workspace]
resolver = "2"
members = ["crates/shared", "crates/engine", "crates/db", "crates/audit", "crates/identity", "crates/mail", "crates/project", "crates/decision", "crates/storage", "crates/release", "crates/decision-log", "apps/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-full", "cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
argon2 = "0.6"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# Decision records encrypted at rest (DNK-18).
aes-gcm = "0.10"
# rustls with the system trust store, so a bank's internal mail relay CA is honoured.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
# One engine version for Studio, Runtime and the editor's WASM linting.
# scripts/check-engine-version.sh fails CI if any of them drift apart.
# Release artifacts: S3, MinIO or a local folder behind one interface.
object_store = { version = "0.14", features = ["aws"] }
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
zen-engine = { version = "=2.0.1", features = ["arbitrary_precision"] }
# Connector nodes, the same handler the Runtime runs; Studio uses its mock mode only (no `live`).
donka-connectors = { git = "https://github.com/youmssi/donka-runtime", rev = "56af4927ac8fe0cf0f1fd90cb00913b705921f2f" }

donka-engine = { path = "crates/engine" }
donka-db = { path = "crates/db" }
donka-audit = { path = "crates/audit" }
donka-decision = { path = "crates/decision" }
donka-identity = { path = "crates/identity" }
donka-project = { path = "crates/project" }
donka-shared = { path = "crates/shared" }
donka-mail = { path = "crates/mail" }
donka-storage = { path = "crates/storage" }
donka-release = { path = "crates/release" }
donka-decision-log = { path = "crates/decision-log" }

# Adopted from gorules/zen: no unsafe code, no unwrap() outside tests (clippy.toml allows it there).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
