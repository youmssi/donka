packages:
  - '.'

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
overrides:
  # DNK-49: patched releases of the same major; remove as the parent locks catch up.
  source-map-js: 1.2.2
  vite: 8.3.3
  systeminformation: 5.33.16
  # jdm-editor pins antd 5.21.2, which cannot render its toasts on React 19. The last antd 5
  # release is compatible and has the official React 19 patch (see decision-editor.tsx).
  '@gorules/jdm-editor>antd': 5.29.3
  # Scalar's JSON magic uses Undici for outbound fetches; keep it on the patched release.
  '@scalar/json-magic>undici': 7.30.1
