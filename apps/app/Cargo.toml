[package]
name = "donka-app"
description = "Donka Studio backend service"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[[bin]]
name = "donka-app"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
donka-audit = { workspace = true, features = ["openapi"] }
donka-decision = { workspace = true }
donka-decision-log = { workspace = true }
donka-db = { workspace = true }
donka-engine = { workspace = true }
donka-identity = { workspace = true, features = ["openapi"] }
donka-mail = { workspace = true }
donka-project = { workspace = true, features = ["openapi"] }
donka-release = { workspace = true }
donka-shared = { workspace = true }
donka-storage = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
donka-mail = { workspace = true, features = ["testing"] }
donka-storage = { workspace = true, features = ["testing"] }
zip = { workspace = true }
sha2 = { workspace = true }
http-body-util = "0.1"

[lints]
workspace = true
