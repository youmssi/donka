[package]
name = "donka-licence"
description = "Studio licence files: signed by Donka with Ed25519, verified offline"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[features]
# Trust the development key (keys/development.pub) instead of Donka's: local development and CI
# only, never a delivered Studio.
development-key = []

[lints]
workspace = true
