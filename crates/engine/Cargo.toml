[package]
name = "donka-engine"
description = "Donka's single doorway to the decision engine (DecisionRuntime + ZEN implementation)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
zen-engine = { workspace = true }
# The engine's own expression parser and schema validator (same versions as zen-engine 2.0.1
# uses): the input contract is read the way the engine reads it.
zen-expression = "=2.0.1"
jsonschema = "0.49"
bumpalo = "3"
donka-connectors = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
