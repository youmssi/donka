# Local development and single-server installs.
#   docker compose up -d postgres minio mailpit   # backing services only (Mailpit UI: http://localhost:8025)
#   docker compose --profile full up -d        # everything (needs ../donka-runtime checked out next to this repo)
name: donka

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: donka
      POSTGRES_PASSWORD: donka
      POSTGRES_DB: donka
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donka"]
      interval: 5s
      retries: 10

  minio:
    # minio/minio and minio/mc were removed from Docker Hub; pgsty/* are maintained builds
    # of the same server and client (see docs/engineering/references.md).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: donka
      MINIO_ROOT_PASSWORD: donka-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  # Creates the release bucket once MinIO is up.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 donka donka-secret; do sleep 1; done;
             mc mb --ignore-existing local/donka-releases"

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["8025:8025", "1025:1025"]

  app:
    profiles: [full]
    build: { context: ., dockerfile: apps/app/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://donka:donka@postgres:5432/donka
      DONKA_SMTP_URL: smtp://mailpit:1025
      DONKA_STORAGE_URL: s3://donka-releases
      DONKA_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    ports: ["8080:8080"]

  # One Runtime per environment; this one serves staging (PROVIDER__PREFIX picks the environment).
  runtime:
    profiles: [full]
    build: ../donka-runtime
    environment:
      PROVIDER__TYPE: S3
      PROVIDER__BUCKET: donka-releases
      PROVIDER__REGION: us-east-1
      PROVIDER__ENDPOINT: http://minio:9000
      PROVIDER__FORCE_PATH_STYLE: "true"
      PROVIDER__PREFIX: staging/
      AWS_ACCESS_KEY_ID: donka
      AWS_SECRET_ACCESS_KEY: donka-secret
      # To send its decisions to Studio's decision log, add a token issued under Runtimes:
      # DECISION_LOG__URL: http://app:8080/api/v1/decision-log/records
      # DECISION_LOG__TOKEN: dnk_log_...
    depends_on: [minio-init]
    ports: ["8090:8080"]

volumes:
  postgres:
  minio:
