# Local development and single-server installs.
#   docker compose up -d postgres minio        # backing services only
#   docker compose --profile full up -d        # everything (needs ../donka-runtime checked out next to this repo)
name: donka

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: donka
      POSTGRES_PASSWORD: donka
      POSTGRES_DB: donka
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donka"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: donka
      MINIO_ROOT_PASSWORD: donka-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  # Creates the release bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 donka donka-secret; do sleep 1; done;
             mc mb --ignore-existing local/donka-releases"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  app:
    profiles: [full]
    build: { context: ., dockerfile: apps/app/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://donka:donka@postgres:5432/donka
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]

  runtime:
    profiles: [full]
    build: ../donka-runtime
    environment:
      PROVIDER__TYPE: S3
      PROVIDER__BUCKET: donka-releases
      PROVIDER__REGION: us-east-1
      PROVIDER__ENDPOINT: http://minio:9000
      PROVIDER__FORCE_PATH_STYLE: "true"
      PROVIDER__PREFIX: production/
      AWS_ACCESS_KEY_ID: donka
      AWS_SECRET_ACCESS_KEY: donka-secret
    depends_on: [minio-init]
    ports: ["8090:8080"]

volumes:
  postgres:
  minio:
